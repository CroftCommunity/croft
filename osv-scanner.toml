# osv-scanner exceptions for croft.
#
# Rule and why: CroftC/.claude/SUPPLY-CHAIN.md rule 9 — every exception is dated,
# reasoned, and expires. An undated ignore is indistinguishable from a decision
# nobody made.
#
# All entries below were settled on 2026-08-29 by reading each advisory's own
# `[affected.functions]` metadata and checking call sites, NOT by reading severity
# scores. Every one of these carries CVSS 4.0 `VC:N/VI:N/VA:H` — no confidentiality
# impact, no integrity impact, availability only. They are correctness and panic
# bugs, not key-compromise bugs, and the 8.2 headline says otherwise to anyone who
# reads only the number.
#
# Re-review trigger: adopting openmls 0.9.0 / openmls_rust_crypto 0.6.0, which pulls
# hpke-rs 0.7.0 and with it libcrux-sha3 0.0.10. That upgrade retires most of this
# file. It is filed as ordinary planned work in TODO.md, deliberately not as an
# emergency — see each reason below.

# ── libcrux-sha3 0.0.8 — COMPILED and in the shipped APK, affected functions NOT reached
[[IgnoredVulns]]
id = "RUSTSEC-2026-0207"
ignoreUntil = 2026-11-29
reason = """Affects the INCREMENTAL SHAKE XOF API — Shake128Xof::squeeze and
Shake256Xof::squeeze — when squeezing across multiple calls at lengths not divisible
by RATE. Our only consumer is hpke-rs 0.6.1, which calls the ONE-SHOT const-generic
API: `libcrux_sha3::shake256::<32>(ikm)` and `::<64>(ikm)` (hpke-rs-0.6.1/src/kem.rs
:154,:158). The incremental type is never constructed. Crate is reachable; the
affected functions are not. Retire by: the openmls 0.9 upgrade (TODO.md)."""

[[IgnoredVulns]]
id = "RUSTSEC-2026-0208"
ignoreUntil = 2026-11-29
reason = """Affects libcrux_sha3::avx2::x4::shake256 — an AVX2 path, which is x86-64
only. The shipped APK carries arm64-v8a ONLY (ops/RUNBOOK-two-device-call-test.md
"ABI note"; the devices report ro.product.cpu.abi = arm64-v8a). The affected code
cannot be executed on the target we ship. Note this exception becomes INVALID the day
croft ships an x86_64 artifact — a desktop shell or an emulator-targeted build — so
re-check it before adding a target, not only before the expiry date."""

# ── libcrux-secrets 0.0.5 — COMPILED, aarch64 IS our target, functions NOT reached
[[IgnoredVulns]]
id = "RUSTSEC-2026-0212"
ignoreUntil = 2026-11-29
reason = """The one that needed real checking: it affects constant-time
libcrux_secrets::Select::select and Swap::swap on aarch64, and aarch64 IS the shipped
target. But those functions have ZERO call sites in either crate that pulls
libcrux-secrets into our tree — libcrux-traits 0.0.6 and libcrux-sha3 0.0.8 both
import only the `U8` secret-typing newtype and `Classify`, never Select or Swap
(grepped for `.select(`/`.swap(`/trait bounds: 0 hits in both). The dependency exists
for its type wrappers, not its constant-time primitives."""

# ── libcrux-aead tree — IN THE LOCKFILE, NEVER COMPILED
# hpke-rs 0.6.1 declares hpke-rs-libcrux as `optional = true`. Our enabled feature set
# is {hazmat, serde, serialization} (cargo tree -e features -i hpke-rs), so
# hpke-rs-libcrux is never activated — and with it libcrux-aead, libcrux-aesgcm and
# libcrux-chacha20poly1305 are never built. Cargo still records unenabled optional
# dependencies in Cargo.lock, so a lockfile-based scanner reports them. `cargo tree -i
# <crate> --target all` prints "nothing to print" for every one: they are in no
# resolved tree on any target.
#
# This is a general property worth stating once: THE LOCKFILE OVER-REPORTS. It is a
# resolution record, not a build manifest.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0209"
ignoreUntil = 2026-11-29
reason = "libcrux-aesgcm is an unenabled optional dependency — in Cargo.lock, in no resolved tree on any target, never compiled into the APK. See the block comment above."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0210"
ignoreUntil = 2026-11-29
reason = "libcrux-aesgcm is an unenabled optional dependency — in Cargo.lock, in no resolved tree on any target, never compiled into the APK. See the block comment above."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0211"
ignoreUntil = 2026-11-29
reason = "libcrux-aesgcm is an unenabled optional dependency — in Cargo.lock, in no resolved tree on any target, never compiled into the APK. See the block comment above."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0124"
ignoreUntil = 2026-11-29
reason = "libcrux-chacha20poly1305 is an unenabled optional dependency — in Cargo.lock, in no resolved tree on any target, never compiled into the APK. See the block comment above."

# ── unmaintained-crate advisories (no vulnerability, no fix to apply)
[[IgnoredVulns]]
id = "RUSTSEC-2026-0173"
ignoreUntil = 2026-11-29
reason = """proc-macro-error2 is unmaintained. It is a build-time proc macro: it runs
on the build host and ships no code in the APK. Retires when the dependent crate moves
off it; not actionable here."""

[[IgnoredVulns]]
id = "RUSTSEC-2024-0384"
ignoreUntil = 2026-11-29
reason = """`instant` is unmaintained (superseded by web-time). Transitive; no
vulnerability, no fix to apply from here. Retires when the dependent crate moves."""

# Added 2026-09-08 with P7 S2's transport. `paste` arrives with iroh — the chain is
# netlink-packet-core -> netdev/netwatch -> iroh -> iroh-gossip -> transport-iroh.
# Dated to the SAME 2026-11-29 sweep as the entries above rather than three months
# from today: aligning it costs nothing and keeps this file to one review date, and
# a later expiry would be buying time nobody asked for.
[[IgnoredVulns]]
id = "RUSTSEC-2024-0436"
ignoreUntil = 2026-11-29
reason = """`paste` is unmaintained (the author archived the repo; `pastey` is the
suggested fork). Checked against the advisory's own metadata on osv.dev, not its
headline: NO severity and an EMPTY affected-functions list — it is a maintenance
advisory, not a vulnerability, so rule 5's fourth rung is vacuous, there being no
affected function to reach.

It is also a proc macro (`cargo metadata` reports targets `[["proc-macro"], ...]`),
so like proc-macro-error2 above it runs on the build host and ships no code in the
APK — even though `cargo tree -p croft-ffi -i paste --edges normal --target
aarch64-linux-android` does put it on the normal-edge path, which is why the gate
could not decide rung 2 mechanically and asked.

Not fixable from here: it is transitive through iroh, and retiring it needs upstream
to move to `pastey`. Retire by: that upstream move, or dropping the iroh dependency."""

# ── rustls 0.23.45 — the licence is KNOWN and unchanged; the DATABASE is behind
#
# THE FIRST per-package licence exception in this workspace. SUPPLY-CHAIN.md rule 7
# recorded "zero per-package licence exceptions were needed anywhere" on 2026-08-29,
# and that stayed true until a security bump outran the licence database.
#
# What happened: RUSTSEC-2026-0285 was issued 2026-09-14 and its only fix is
# rustls >= 0.23.45. That version was hours old when we took it, and deps.dev had
# no record for it at all, so osv-scanner read the licence as UNKNOWN and the gate
# blocked — correctly, since UNKNOWN is not in LICENCE_ALLOWLIST.
#
# Why this is an override and not a widened allowlist: the licence is not unknown to
# US. Read from the crate's own manifest in the local registry cache, both versions
# are identical and already allowlisted:
#
#   rustls-0.23.43/Cargo.toml   license = "Apache-2.0 OR ISC OR MIT"
#   rustls-0.23.45/Cargo.toml   license = "Apache-2.0 OR ISC OR MIT"
#
# and deps.dev serves exactly that for 0.23.43 (published 2026-07-29) while returning
# no record for 0.23.45. This is a data-freshness artifact with a known expiry: it
# resolves itself the moment deps.dev ingests the version. Widening the allowlist to
# accept UNKNOWN would silence every future unknown licence permanently, which is the
# thing rule 7 exists to prevent.
#
# Checked that this is an ASSERTION and not a silencer: with the override in place and
# the allowlist deliberately narrowed to MIT alone, rustls is still reported as a
# violation (Apache-2.0 and ISC are then disallowed). The override states the licence;
# the gate still judges it. A blanket ignore would have cleared it under any allowlist.
#
# RETIRE THIS by deleting the block once `deps.dev/v3alpha/systems/cargo/packages/
# rustls/versions/0.23.45` returns a licences field. If the date below passes and it
# still does not, that is a finding about deps.dev, not a reason to extend.
[[PackageOverrides]]
name = "rustls"
version = "0.23.45"
ecosystem = "crates.io"
license.override = ["Apache-2.0", "ISC", "MIT"]
effectiveUntil = 2026-10-05
reason = """deps.dev has no record for this version yet (published hours before we
took it, to fix RUSTSEC-2026-0285), so the scanner reads UNKNOWN. The crate's own
manifest declares Apache-2.0 OR ISC OR MIT, identical to 0.23.43, which deps.dev
already serves and which is already allowlisted. Verified by reading both manifests,
not inferred. Delete once deps.dev catches up."""
