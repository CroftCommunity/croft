[package]
name = "social-tree-core"
version = "0.1.0"
edition = "2021"
# Owner decision 2026-08-21 (E117 integration §6.7), consistent with the standing
# A14 decision: AGPL for everything Drystone/Croft.
license = "AGPL-3.0-or-later"
description = "The Drystone social-tree substrate: the governance fold, its projections, and the wire codecs — pure, storage-free, clock-free. The foundation the per-pond feature cores stand on."

[features]
default = ["ed25519"]
# The real-crypto port realizations. Off in the lean build (the
# no-default-features CI arm proves the fold itself needs no crypto crate).
ed25519 = ["dep:ed25519-dalek"]

[dependencies]
blake3 = "1"
thiserror = "1"
ed25519-dalek = { version = "2", optional = true }

[dev-dependencies]
proptest = "1"
serde_json = "1"
