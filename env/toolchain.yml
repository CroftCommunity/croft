# The toolchain, declared. Pinned version + checksum per artifact, following the
# croft-stack idiom (ansible/group_vars/all.yml: version + sha256 for every
# fetched binary).
#
# THE POINT IS NOT RIGIDITY. It is that a wrecked environment is one command from
# restored, so experiments stop being scary. Pinning without a fast rebuild is
# just rigidity; pinning with `make bootstrap` is freedom.
#
# CHECKSUM RULE: never type one from memory. A new artifact starts with the
# literal value UNSET, and `verify.sh` FAILS while any value is unset. Populate
# from the real artifact with:
#
#   make record-checksums
#
# A guessed checksum is worse than none: it looks like verification and performs
# none. (verify.sh strips comments before checking, so this paragraph does not
# trip its own gate -- it did once.)

meta:
  # Bump deliberately: change the version, run `make record-checksums`, run
  # `make verify`, and commit both in one change.
  reviewed: "2026-08-11"

jdk:
  # Gradle provisions this itself via toolchains + the foojay resolver, so it does
  # NOT depend on whatever JAVA_HOME points at. This machine's default is
  # Temurin 8, which would silently be wrong.
  version: "17"
  vendor: "temurin"
  provisioned_by: "gradle-toolchains"

gradle:
  # Committed wrapper is the pin. distributionSha256Sum in
  # gradle/wrapper/gradle-wrapper.properties verifies the bytes, not just the name.
  # Matches android/gradle/wrapper/gradle-wrapper.properties. Was 8.13 before the
  # client landed; aligned DOWN to the version connect's CI actually builds with,
  # because bumping Gradle while diagnosing a crash adds an independent variable.
  version: "8.11.1"
  distribution_sha256: "f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6"

android:
  agp: "8.7.3"
  kotlin: "2.2.0"
  compile_sdk: 35
  min_sdk: 26
  target_sdk: 35

  # sdkmanager package IDs, exact. verify.sh diffs this list against
  # `sdkmanager --list_installed` and exits non-zero on any difference in either
  # direction -- a missing package OR an unexpected extra one.
  sdk_packages:
    - "platform-tools"
    - "platforms;android-35"
    - "build-tools;35.0.0"
    - "emulator"
    - "system-images;android-35;google_apis;arm64-v8a"
    # NDK: required to build libiroh_ffi.so for Android. NOT optional and NOT a
    # convenience -- iroh-ffi's own README.kotlin.md states the Maven Central
    # artifact (computer.iroh:iroh) is "Kotlin / JVM" and documents Android as a
    # separate build-it-yourself path. There is no published Android AAR. The
    # app crashed on launch for exactly this reason; see ops/JOURNAL.md.
    #
    # Pinned to a release, not an rc: 29.x has rc3/rc4/final and 30.x is rc only.
    - "ndk;29.0.14206865"
  ndk_version: "29.0.14206865"

  # iroh-ffi source tag, built per-ABI by env/build-iroh-android.sh.
  # Pinned because the Maven artifact is Kotlin/JVM only -- there is no Android
  # AAR, so this source build IS the dependency. Must track the iroh version the
  # app's Kotlin bindings expect (computer.iroh:iroh:1.0.0).
  iroh_ffi_tag: "v1.0.0"

  # ABI IS NOT A PERFORMANCE PREFERENCE HERE.
  # Real phones are arm64-v8a. An x86_64 emulator image can MASK a native-library
  # packaging bug (the JNA @aar / ABI class) that arm64 reproduces -- which is
  # exactly the bug class we are currently chasing in the croftcall client. A
  # wrong ABI here makes the emulator lie to us.
  abi: "arm64-v8a"

  # The ABIs we actually build native libraries for. arm64-v8a covers every
  # current phone and the emulator image; armeabi-v7a is legacy 32-bit and is
  # deliberately deferred rather than assumed -- each ABI is a full iroh compile.
  native_abis:
    - "arm64-v8a"

rust:
  # The shared core. Pinned for the same reason the workspace pins everywhere
  # else: two compilers validate two different claims.
  channel: "1.97.1"
  components: ["clippy", "rustfmt"]
  targets:
    - "aarch64-linux-android"
    - "armv7-linux-androideabi"
    - "wasm32-unknown-unknown"

node:
  # For the web shell's tooling only.
  version: "22"
