# The croft gate, in CI (G7 — trigger: G6, which fired when the first core
# landed). The CI-PATTERN rules this encodes: a workflow without a pull_request
# trigger is a notification, not a gate; the toolchain is the SAME pin CI and
# local resolve (rust-toolchain.toml; env/verify.sh refuses drift); one gate
# command, identical locally and in CI (`make gate`). Watch it fail before
# trusting it.
name: gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    # CI-PATTERN rule 8. Without it a job inherits GitHub's six-hour default,
    # and a test that HANGS rather than fails sits there for all of it — in
    # `fun` that produced "every test passed, run failed", which is not a shape
    # anyone reads quickly. Sized with room: store-redb's promoted suite is
    # proptest-heavy and takes ~5 minutes on its own.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: rustup syncs the pinned toolchain (rust-toolchain.toml)
        run: rustup show
      - name: make gate
        run: make gate

  core-purity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: rustup syncs the pinned toolchain
        run: rustup show
      - name: wasm arm — the core compiles for wasm32-unknown-unknown
        run: cargo check -p social-tree-core --target wasm32-unknown-unknown
      - name: wasm arm — the chat pond compiles for wasm32-unknown-unknown
        run: cargo check -p chat-core --target wasm32-unknown-unknown
      - name: no-default-features arm
        run: cargo check -p social-tree-core --no-default-features
      - name: clippy, including the disallowed-methods purity lints
        # --force-warn, not -A: the crate's own #![warn(missing_docs)] ratchet
        # overrides a CLI -A (source attributes win), and -D warnings would then
        # elevate the docs burn-down into a red gate. force-warn cannot be
        # overridden from either side — the ratchet stays a warning until the
        # crate flips it to deny when clean (ADR-0002). (Two sessions diagnosed
        # the dead -A independently; this form also denies rustc warnings —
        # unused imports, dead code — which -D clippy::all alone would let pass.)
        run: cargo clippy -p social-tree-core -- -D warnings --force-warn missing_docs
      - name: fmt
        run: cargo fmt -p social-tree-core -- --check

  # The two crates P7 S0 landed. A separate job from core-purity because they
  # are not pure and must not be held to that standard: `store-redb` opens
  # files and `croft-ffi` holds a signing key, which is the whole point of
  # living under ports/ and ffi/ rather than in core/ (ADR-0003).
  #
  # Same clippy form as above, for the same reason — and it is DENY-clean on
  # both crates today rather than aspirationally so, which is why it is worth
  # having: an arm that is red on the commit that adds it teaches people to
  # ignore it.
  ports-and-ffi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: rustup syncs the pinned toolchain
        run: rustup show
      - name: clippy — store-redb
        run: cargo clippy -p store-redb --all-targets -- -D warnings --force-warn missing_docs
      - name: clippy — croft-ffi
        run: cargo clippy -p croft-ffi --all-targets -- -D warnings --force-warn missing_docs
      - name: fmt — store-redb
        run: cargo fmt -p store-redb -- --check
      - name: fmt — croft-ffi
        run: cargo fmt -p croft-ffi -- --check
