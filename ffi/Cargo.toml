# The uniffi surface: the shared core, reachable from a platform shell.
#
# Grown from the D1 spike (plan 2026-08-25-1 § Phase 0) under S0. The spike
# answered one question — does OUR crate cross uniffi — and this crate is what
# was built on the yes.
#
# The object graph IS ADR-0002's sentence: one substrate instance per shell,
# owned by the shell, ports beside it. `Session` holds the store, the signer
# and the fold; the pond holds none of them and never learns redb exists.
[package]
name = "croft-ffi"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "The uniffi surface over the croft core: one session, the chat pond's loop, the redb store"
publish = false

[lib]
# cdylib is what JNA loads; the rlib keeps the crate testable from Rust.
crate-type = ["cdylib", "lib"]
name = "croft_ffi"

[dependencies]
# 0.31.1's Kotlin templates use `com.sun.jna.internal.Cleaner`, which needs JNA
# >= 5.12 — satisfied by the JNA 5.14.0 already on the android classpath
# (android/app/build.gradle.kts). One JNA across both is the point: two on a
# classpath is a packaging bug waiting to happen.
uniffi = "=0.31.1"
thiserror = "1"
social-tree-core = { path = "../core/social-tree-core" }
chat-core = { path = "../core/chat-core" }
store-redb = { path = "../ports/store-redb" }
# S2: the key layer. Sealed chat is what makes a group a conversation rather
# than a shared log, and the seal happens Rust-side beside the store — the same
# argument as for effects: the material must not cross the FFI.
keylayer-openmls = { path = "../ports/keylayer-openmls" }
# S2: the transport. A second port beside the key layer, not folded into it —
# the session owns MLS state and the store, the link owns a socket and a swarm,
# and rung 6 (force-stop, relaunch, reload the group) is precisely a moment
# when there is state and no swarm.
transport-iroh = { path = "../ports/transport-iroh" }
# The boundary is the one place a failure can go quiet: Rust returns an error,
# the binding hands the shell an exception, and what happens next is out of this
# crate's hands. Emitting here leaves something behind to find afterwards.
# Routing these to logcat needs android app code and belongs to S1.
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tracing-subscriber = "0.3"

[[bin]]
# The bindgen CLI, per uniffi's recommended layout. Gated: `uniffi_bindgen_main`
# only exists under uniffi's `cli` feature, so an ungated bin breaks a plain
# `cargo test -p croft-ffi` (observed during D1).
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
default = []
cli = ["uniffi/cli"]
