# The croft Rust workspace. Shells (android/apple/web) build separately; this
# workspace is the shared functional core plus its port realizations. Core
# crates are pure — no I/O, no clock (docs/ADR-0002-core-layering.md); port
# crates under ports/ hold the impure realizations (ADR-0003: the openmls
# key layer lives outside the core so the core's lean arms never pull it).
[workspace]
resolver = "2"
members = ["core/social-tree-core", "ports/keylayer-openmls"]
